name: 100% Free YouTube Only Live Stream

on:
  workflow_dispatch: # Manual start ke liye
  schedule:
    - cron: '0 */5 * * *' # Har 5 ghante mein automatic restart

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Start YouTube Loop Stream
      run: |
        # Facebook hata diya gaya hai, ab yeh bina ruke seedhe YouTube par stream push karega
        timeout 19800s ffmpeg -re -stream_loop -1 -i video.mp4 \
          -c:v libx264 -preset ultrafast -b:v 2000k -maxrate 2000k -bufsize 4000k -pix_fmt yuv420p -g 50 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://://youtube.com{{ secrets.YT_STREAM_KEY }}" || true
